<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" />
  <title>robot-heads</title>
  <meta name="description" content="Animated 3D robot heads for Vue: TV-headed bots with LED faces that show what your agent is doing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="preload" href="/fonts/OpenRunde-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    try {
      var saved = localStorage.getItem('robot-heads-theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
